# `.pre-commit-config.yaml` — commit-time enforcement (Practices Playbook Pillar VI)
#
# Install once per clone:
#   pre-commit install
#
# PIN RULE: keep `ruff-pre-commit` and frontend hook `rev` values aligned with
# `backend/uv.lock` and `frontend/package-lock.json` in the same commit when
# Phase 0 lockfiles land.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|tests)/
      - id: ruff-format
        files: ^(backend|tests)/
