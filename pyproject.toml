[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[project]
name = "security-cam-time-lapse"
version = "0.1.0"
description = "Self-hosted scheduled security-camera still capture and interactive timelapse player"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "apscheduler>=3.11,<4.0",
    "cryptography>=44.0,<46.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pillow>=11.0,<14.0",
    "sqlalchemy>=2.0.36,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.11.0,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend"
explicit_package_bases = true
plugins = []
