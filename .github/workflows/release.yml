name: Release

# Practices Playbook Pillar VII — builds, smoke-tests, and publishes the tagged
# container artifact to GHCR.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - run: echo "::notice title=Release version::${{ steps.gitversion.outputs.semVer }}"

  build-and-publish:
    name: Build, smoke test, and publish
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: |
          docker build \
            --build-arg VERSION="${{ needs.version.outputs.semver }}" \
            -t "ghcr.io/${{ github.repository }}:${{ needs.version.outputs.semver }}" \
            -t "ghcr.io/${{ github.repository }}:latest" \
            .

      - name: Smoke test container startup and non-root execution
        run: |
          docker run -d --name smoke \
            -e APP_SECRET_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" \
            -p 8000:8000 \
            "ghcr.io/${{ github.repository }}:${{ needs.version.outputs.semver }}"
          sleep 5
          docker inspect -f '{{.State.Running}}' smoke | grep -q true
          uid="$(docker exec smoke id -u)"
          test "$uid" != "0"
          curl -fsS http://localhost:8000/api/health | grep -q "${{ needs.version.outputs.semver }}"
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ needs.version.outputs.semver }}"
          docker push "ghcr.io/${{ github.repository }}:latest"
