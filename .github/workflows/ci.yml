name: CI

# Practices Playbook Pillar VI — tiered by risk and cost; PR-triggered so
# workflow minutes are never spent twice per push.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # FAST TIER — runs on every PR into develop or main.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: cp .env.example .env && sed -i "s/^APP_SECRET_KEY=$/APP_SECRET_KEY=ci-dummy-secret-key-0000000000000000/" .env && sed -i "s/^BOOTSTRAP_ADMIN_PASSWORD=$/BOOTSTRAP_ADMIN_PASSWORD=ci-dummy-admin-pass/" .env
      - run: just lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: cp .env.example .env && sed -i "s/^APP_SECRET_KEY=$/APP_SECRET_KEY=ci-dummy-secret-key-0000000000000000/" .env && sed -i "s/^BOOTSTRAP_ADMIN_PASSWORD=$/BOOTSTRAP_ADMIN_PASSWORD=ci-dummy-admin-pass/" .env
      - run: just typecheck

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: cp .env.example .env && sed -i "s/^APP_SECRET_KEY=$/APP_SECRET_KEY=ci-dummy-secret-key-0000000000000000/" .env && sed -i "s/^BOOTSTRAP_ADMIN_PASSWORD=$/BOOTSTRAP_ADMIN_PASSWORD=ci-dummy-admin-pass/" .env
      - run: just schema-drift

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: cp .env.example .env && sed -i "s/^APP_SECRET_KEY=$/APP_SECRET_KEY=ci-dummy-secret-key-0000000000000000/" .env && sed -i "s/^BOOTSTRAP_ADMIN_PASSWORD=$/BOOTSTRAP_ADMIN_PASSWORD=ci-dummy-admin-pass/" .env
      - run: just test unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: cp .env.example .env && sed -i "s/^APP_SECRET_KEY=$/APP_SECRET_KEY=ci-dummy-secret-key-0000000000000000/" .env && sed -i "s/^BOOTSTRAP_ADMIN_PASSWORD=$/BOOTSTRAP_ADMIN_PASSWORD=ci-dummy-admin-pass/" .env
      - run: just test integration

  version:
    name: Compute version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - run: echo "computed version ${{ steps.gitversion.outputs.semVer }}"

  ops-validate:
    name: Validate ops artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash -s -- 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint -color
      - name: Validate Compose config
        run: |
          if [ -f docker-compose.yml ]; then
            cp .env.example .env
            docker compose -f docker-compose.yml config --quiet
          fi

  # ---------------------------------------------------------------------------
  # FULL GATE — runs on release PRs into `main` or manual dispatch.
  # ---------------------------------------------------------------------------

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: cp .env.example .env && sed -i "s/^APP_SECRET_KEY=$/APP_SECRET_KEY=ci-dummy-secret-key-0000000000000000/" .env && sed -i "s/^BOOTSTRAP_ADMIN_PASSWORD=$/BOOTSTRAP_ADMIN_PASSWORD=ci-dummy-admin-pass/" .env
      - run: just dev
      - run: just e2e

  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t security-cam-time-lapse:scan .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "security-cam-time-lapse:scan"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          cache: false
